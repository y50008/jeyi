[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-brain-agent"
version = "4.3.0"
description = "全图底座记忆引擎：用 300 字/轮的预算记住一个人几个月的事"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = []            # 核心零运行时依赖，刻意为之

[project.optional-dependencies]
# 稠密检索（推荐）：留出集 77.8% -> 85.2%，主集 96.2% -> 98.1%，不要 GPU、不要 API key
dense = ["numpy>=1.26", "onnxruntime>=1.19", "tokenizers>=0.20"]
# 远程 embedding / LLM 复核：走 stdlib urllib，仍然零依赖，填一个 endpoint 即可
remote = []
dev = []

[tool.setuptools.packages.find]
include = ["brain*"]
