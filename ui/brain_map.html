["v25","first","cooccur",.6],["v25","nofab","entail",.8],["v25","sparse","entail",.7],
["fish","v3","causal",.85],["fish","fishdata","entail",.8],["v3","vs","cooccur",.6],["vs","philo","cooccur",.7],
["six","tri","cooccur",.6],["six","spread","cooccur",.6],["six","settle","causal",.8],["six","window","entail",.7],
["tri","sacred","entail",.8],["tri","schema","entail",.8],["spread","settle","cooccur",.7],
["settle","budget","entail",.8],["settle","time","cooccur",.6],["time","echo5","cooccur",.5],
["echo5","zeig","entail",.8],["recall","dim14","entail",.8],["recall","exp","causal",.6],
["exp","final","causal",.7],["anti","final","conflict",.4],
["first","philo","rhyme",.9],["fish","philo","rhyme",.7],["crit","settle","rhyme",.5],
["final","philo","entail",.9],["final","settle","entail",.85],["final","tri","entail",.85]
];
// ---- 真实数据接入：tools/export_map.py 会注入 window.__BRAIN__ ----
const D = window.__BRAIN__ || null;
const SESS = D ? D.sess : SESS_SAMPLE;
const N = D ? D.nodes : N_SAMPLE;
const E = D ? D.edges : E_SAMPLE;
if (D) {
  document.getElementById("srcBadge").textContent =
    `引擎导出 · ${D.meta.nodes} 节点 / ${D.meta.edges} 边 · ${D.meta.exported} · ${D.meta.note}`;
}
// 会话内按重要性链式连接（时间切片链）
SESS.map(s=>s.id).forEach(s=>{
  const ns=N.filter(n=>n.sess===s).sort((a,b)=>b.imp-a.imp);
  for(let i=0;i+1<ns.length;i++) E.push([ns[i].id,ns[i+1].id,"temporal",.25]);
});
const TC={event:"#ffd166",fact:"#06d6a0",skill:"#4cc9f0",lesson:"#ef476f",reflection:"#b5838d",rule:"#f78c6b"};
const TN={event:"事件",fact:"事实",skill:"技能",lesson:"道理",reflection:"反思",rule:"规则"};
const EC={temporal:"#8ecae6",causal:"#ffb703",cooccur:"#5b6b83",rhyme:"#ff70a6",conflict:"#e63946",entail:"#90be6d",topic:"#7b8aa0",entity:"#4cc9f0"};
const EN={temporal:"时序",causal:"因果",cooccur:"共现",rhyme:"押韵",conflict:"矛盾",entail:"蕴含",topic:"主题",entity:"实体"};
// v4.0 打分结构（与 brain/score.py 对齐；页面内是近似实现，权威数字见 tools/bench.py）
const W={rel:.65,prior:.25,graph:.35};
const byId={}; N.forEach(n=>byId[n.id]=n);
N.forEach((n,i)=>{ n.x=0;n.y=0;n.vx=0;n.vy=0;n.glow=0;n.spread=0;n.peel=0;
  const ring={working:110,active:230,archive:350}[n.slice];
  const a=i*2.399963; n.x=innerWidth/2+ring*Math.cos(a); n.y=innerHeight/2+ring*Math.sin(a); });
const adj={}; N.forEach(n=>adj[n.id]=[]);
E.forEach(([a,b,t,w])=>{adj[a].push({b,t,w});adj[b].push({a,t,w});});
const cv=document.getElementById("cv"),ctx=cv.getContext("2d");
let DPR=Math.min(2,devicePixelRatio||1);
function resize(){cv.width=innerWidth*DPR;cv.height=innerHeight*DPR;cv.style.width=innerWidth+"px";cv.style.height=innerHeight+"px";}
resize();addEventListener("resize",resize);
// 星空
const stars=Array.from({length:130},()=>({x:Math.random(),y:Math.random(),r:Math.random()*1.3+.2,p:Math.random()*6.28}));
// 物理
let dragN=null,moved=false,mx=0,my=0,hoverN=null,sel=null,sessFilter="ALL",lastRes=[];
function physics(){
  const cx=innerWidth/2,cy=innerHeight/2;
  for(const a of N){ if(a===dragN)continue;
    let fx=(cx-a.x)*.012,fy=(cy-a.y)*.012;
    for(const b of N){ if(a===b)continue;
      let dx=a.x-b.x,dy=a.y-b.y,d2=dx*dx+dy*dy+40,f=(2600*Math.max(1,60/N.length))/d2;
      fx+=dx/Math.sqrt(d2)*f; fy+=dy/Math.sqrt(d2)*f; }
    for(const e of adj[a.id]){ const b=byId[e.b]; if(!b)continue;
      const L=({temporal:130,causal:105,cooccur:95,rhyme:95,conflict:150,entail:110,topic:100,entity:100})[e.t]||110;
      let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1;
      fx+=(d-L)*dx/d*.02*e.w*4; fy+=(d-L)*dy/d*.02*e.w*4; }
    a.vx=(a.vx+fx)*.86; a.vy=(a.vy+fy)*.86; a.x+=a.vx; a.y+=a.vy; }
}
function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle="#050810";ctx.fillRect(0,0,innerWidth,innerHeight);
  const t=performance.now()/1000;
  for(const s of stars){ctx.globalAlpha=.25+.25*Math.sin(t+s.p);ctx.fillStyle="#8ecae6";
    ctx.beginPath();ctx.arc(s.x*innerWidth,s.y*innerHeight,s.r,0,7);ctx.fill();}
  ctx.globalAlpha=1;
  const dimSess=n=>sessFilter!=="ALL"&&n.sess!==sessFilter;
  for(const [a,b,tp,w] of E){const na=byId[a],nb=byId[b];if(!na||!nb)continue;
    const selE=sel&&(a===sel.id||b===sel.id);
    ctx.globalAlpha=dimSess(na)||dimSess(nb)?.03:(sel?(selE?.55:.05):.10+.22*w);
    ctx.strokeStyle=EC[tp];ctx.lineWidth=selE?1.6:1;
    ctx.beginPath();ctx.moveTo(na.x,na.y);ctx.lineTo(nb.x,nb.y);ctx.stroke();}
  for(const n of N){const dim=dimSess(n);
    const base=({working:1,active:.92,archive:.42})[n.slice];
    const r=5+9*n.imp+(n===sel?2:0);
    if(n.glow>0){const g=ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,r*4);
      g.addColorStop(0,"rgba(76,201,240,.55)");g.addColorStop(1,"rgba(76,201,240,0)");
      ctx.globalAlpha=Math.min(1,n.glow)*base;ctx.fillStyle=g;
      ctx.beginPath();ctx.arc(n.x,n.y,r*4,0,7);ctx.fill();}
    ctx.globalAlpha=(dim?.08:base);
    ctx.fillStyle=TC[n.type];
    ctx.beginPath();ctx.arc(n.x,n.y,r,0,7);ctx.fill();
    ctx.lineWidth=n.slice==="working"?2.4:1.2;
    ctx.strokeStyle=n.slice==="working"?"#ffffff":n.slice==="archive"?"#33415c":"#8fa3c0";
    ctx.stroke();
    if(n===hoverN||n===sel||n.imp>.88){ctx.globalAlpha=dim?.08:.95;
      ctx.font="11px Microsoft YaHei,monospace";ctx.fillStyle=e=>"#dfe8f5";
      ctx.fillStyle="#dfe8f5";ctx.textAlign="center";
      ctx.fillText(n.label,n.x,n.y-r-6);}}
  ctx.globalAlpha=1;
  requestAnimationFrame(tick);
}
function tick(){physics();for(const n of N)n.glow*=.965;draw();}
requestAnimationFrame(tick);
// 交互
function pick(x,y){let best=null,bd=1e9;for(const n of N){const d=Math.hypot(n.x-x,n.y-y);if(d<18+9*n.imp&&d<bd){bd=d;best=n;}}return best;}
cv.addEventListener("mousedown",e=>{mx=e.clientX;my=e.clientY;moved=false;dragN=pick(mx,my);});
cv.addEventListener("mousemove",e=>{const x=e.clientX,y=e.clientY;
  if(dragN){if(Math.hypot(x-mx,y-my)>4)moved=true;dragN.x=x;dragN.y=y;dragN.vx=dragN.vy=0;}
  hoverN=pick(x,y);cv.style.cursor=dragN?"grabbing":hoverN?"pointer":"default";});
cv.addEventListener("mouseup",e=>{if(dragN&&!moved){select(dragN);}dragN=null;});
cv.addEventListener("dblclick",()=>{sel=null;lastRes=[];renderPanel();});
// 检索
function toks(s){return (s.toLowerCase().match(/[a-z0-9]+|[\u4e00-\u9fff]/g)||[]);}
function runQuery(){const q=document.getElementById("q").value.trim();if(!q)return;
  const qt=new Set(toks(q)),seeds=[];
  for(const n of N){if(n.slice==="archive")continue;
    const st=new Set(toks(n.label+n.gist));
    const sem=[...qt].filter(x=>st.has(x)).length/Math.max(1,qt.size+st.size- [...qt].filter(x=>st.has(x)).length);
    const ft=n.feel?new Set(toks(n.feel.label+(n.feel.why||""))):new Set();
    const rhyme=[...qt].some(x=>ft.has(x))?1:0;
    if(sem>0||rhyme)seeds.push({n,sem,rhyme});}
  // 扩散波
  N.forEach(n=>{n.glow=0;n.spread=0;});
  let frontier=seeds.map(s=>({id:s.n.id,v:1}));const seen=new Set(frontier.map(f=>f.id));
  seeds.forEach(s=>{s.n.glow=1;});
  const spread={}; frontier.forEach(f=>spread[f.id]=1);
  let hop=0;
  (function wave(){ if(hop>=3||!frontier.length){finish();return;}
    const gain={};
    for(const f of frontier){ for(const e of adj[f.id]){ if(!seen.has(e.b)) gain[e.b]=(gain[e.b]||0)+f.v*e.w; } }
    frontier.forEach(f=>seen.add(f.id));
    const top=Object.entries(gain).sort((a,b)=>b[1]-a[1]).slice(0,3);
    frontier=top.map(([id,v])=>({id,v:v*.6}));
    frontier.forEach(f=>{spread[f.id]=(spread[f.id]||0)+f.v; byId[f.id].glow=Math.max(byId[f.id].glow,.35+.5*f.v);});
    hop++; setTimeout(wave,240); })();
  function finish(){ const mx=Math.max(1,...Object.values(spread));
    const GROWTH=.45, rows=[];
    const ids=new Set([...seeds.map(s=>s.n.id),...Object.keys(spread)]);
    for(const id of ids){ const n=byId[id]; if(!n) continue;
      const sd=seeds.find(s=>s.n.id===id), sem=sd?sd.sem:0;
      const g=(spread[id]||0)/mx;
      const rel=Math.max(sem,GROWTH*g);
      const fresh=n.slice==="working"?1:n.slice==="active"?.8:.4;
      const prior=.45*n.imp+.30*fresh+(n.feel?.25:0);
      rows.push({n:n,sem:sem,rhyme:sd?sd.rhyme:0,graph:g,
        decomp:{rel:rel,prior:prior,graph:g},
        score:W.rel*rel+W.prior*prior+W.graph*g}); }
    lastRes=rows.filter(o=>o.decomp.rel>=.06||o.graph>=.22)
      .sort((a,b)=>b.score-a.score).slice(0,6);
    renderPanel(); }}
// 抽丝剥茧
function select(n){ if(sel===n){n.peel=Math.min(3,n.peel+1);} else {n.peel=1;} sel=n; renderPanel(); }
function renderPanel(){ const p=document.getElementById("panel");
  if(!sel){p.innerHTML='<p style="color:#5b6b83;font-size:12px;margin-top:30px;text-align:center">点击节点开始抽丝剥茧<br>双击空白重置</p>';return;}
  const n=sel,peel=n.peel||1;
  let h=`<h2>${n.label}</h2>
    <span class="tag" style="background:${TC[n.type]}22;color:${TC[n.type]};border:1px solid ${TC[n.type]}66">${TN[n.type]}</span>
    <span class="tag" style="background:#12203a;color:#8fa3c0;border:1px solid #243b5e">${{working:"工作记忆",active:"活跃",archive:"归档"}}[n.slice]</span>
    <span class="tag" style="background:#12203a;color:#8fa3c0;border:1px solid #243b5e">重要性 ${n.imp.toFixed(2)}</span>
    <div class="peeldots">${[1,2,3].map(i=>`<div class="peeldot ${i<=peel?"on":""}"></div>`).join("")}</div>`;
  if(peel>=1) h+=`<div class="sec"><h3>第一层 · 轮廓（gist）</h3><p>${n.gist}</p></div>`;
  if(peel>=2){ h+=`<div class="sec"><h3>第二层 · 锚点与情感</h3>`;
    n.vb.forEach(v=>h+=`<div class="vb">“${v}”</div>`);
    if(n.feel) h+=`<div class="feel">feeling：${n.feel.label} · why：${n.feel.why}<br><span class="src">valid_at ${n.feel.valid_at}（旧事用过去时态提起）</span></div>`;
    if(!n.vb.length&&!n.feel)h+=`<p class="src">（无锚点 / 无情感标记——稀疏性生效）</p>`;
    h+=`</div>`; }
  if(peel>=3) h+=`<div class="sec"><h3>第三层 · 溯源（provenance）</h3>${n.src.map(s=>`<p class="src">· ${s}</p>`).join("")}<p class="src">写入 ${n.sess} · 永不删除（P2）</p></div>`;
  if(peel<3) h+=`<button id="peelBtn" onclick="sel.peel=Math.min(3,sel.peel+1);renderPanel()">再剥一层（${3-peel} 层剩余）</button>`;
  if(lastRes.length){ h+=`<div class="sec"><h3>检索得分分解（v4：rel / prior / graph）</h3>`;
    const C={rel:"#06d6a0",prior:"#8fa3c0",graph:"#4cc9f0"};
    const CN={rel:"相关",prior:"先验",graph:"扩散"};
    for(const o of lastRes){ if(o.n!==n)continue;
      h+=`<div class="resrow"><div class="rl"><span>${o.n.label}</span><span>${(o.score*100).toFixed(0)}</span></div><div class="bar">`+
        Object.keys(W).map(k=>`<div style="width:${Math.min(100,W[k]*o.decomp[k]*100/1.25)}%;background:${C[k]}"></div>`).join("")+`</div></div>`;}
    h+=`<p class="src">${Object.keys(W).map(k=>`<span style="color:${C[k]}">■</span>${CN[k]}×${W[k]} `).join(" ")}</p></div>`; }
  p.innerHTML=h; }
// 结算
let settleCount=0;
function settle(){ const toast=document.getElementById("toast");toast.style.display="block";
  const steps=["① replay 交错：新旧节点一起重放…","② 预测误差检测：扫描 gist 冲突候选…","③ 图式挂载：新记忆挂到既有道理节点…","④ 再巩固写回：提起过的旧记忆进入更新窗口…","⑤ 生成反思节点 ✓"];
  steps.forEach((s,i)=>setTimeout(()=>{toast.textContent=s;
    if(i===steps.length-1){settleCount++;
      const nid="R"+settleCount;
      N.push({id:nid,label:"反思 · 结算 #"+settleCount,type:"reflection",slice:"working",imp:.6,sess:"S2",
        gist:`本次结算：新增 1 反思节点；预算 nodes≤5 edges≤3；第${14}维效率已刷新。`,
        vb:[],feel:{label:"踏实",why:"安静清醒期就是巩固窗口",valid_at:"2026-11-04"},src:["结算协议 §6"],x:innerWidth/2+(Math.random()*120-60),y:innerHeight/2+(Math.random()*120-60),vx:0,vy:0,glow:1,spread:0,peel:0});
      byId[nid]=N[N.length-1];adj[nid]=[];
      const tops=N.filter(m=>m.type==="lesson").sort((a,b)=>b.imp-a.imp).slice(0,2);
      tops.forEach(m=>{adj[nid].push({b:m.id,t:"entail",w:.7});adj[m.id].push({b:nid,t:"entail",w:.7});});
      E.push([nid,tops[0].id,"entail",.7],[nid,tops[1].id,"entail",.7]);
      updateStats(); setTimeout(()=>toast.style.display="none",1600); renderPanel(); }},i*600)); }
// 过滤 / 统计 / 时间链
function filterSlices(){ const cbs=document.querySelectorAll('header input[type=checkbox]');
  const show={working:cbs[0].checked,active:cbs[1].checked,archive:cbs[2].checked};
  N.forEach(n=>{n.hidden=!show[n.slice];});
  N.forEach(n=>{ if(n.hidden){} }); updateStats(); }
function updateStats(){ const vis=N.filter(n=>!n.hidden);
  const w=vis.filter(n=>n.slice==="working").length,a=vis.filter(n=>n.slice==="active").length,ar=vis.filter(n=>n.slice==="archive").length;
  // 统计口径改为实测：记忆字符 / 注入均值 / 压缩比（不再用 w*120+a*45 这种拍出来的 token 估算）
  const chars=vis.reduce((s,n)=>s+(n.gist||"").length+(n.vb&&n.vb[0]?n.vb[0].length:0),0);
  const avg=D&&D.meta&&D.meta.avg_inject_chars?D.meta.avg_inject_chars:0;
  document.getElementById("stTok").textContent=chars;
  document.getElementById("stN").textContent=vis.length;
  document.getElementById("stE").textContent=avg?(chars/Math.max(1,avg)).toFixed(1)+"x":"—";
  document.getElementById("stA").textContent=(ar/Math.max(1,a+ar)*100).toFixed(0)+"%"; }
const sessEl=document.getElementById("sess");
["ALL",...SESS.map(s=>s.id)].forEach(s=>{ const d=document.createElement("div");
  d.className="chip"+(s==="ALL"?" on":"");d.textContent=s==="ALL"?"全部时间":SESS.find(x=>x.id===s).label;
  d.onclick=()=>{sessFilter=s;document.querySelectorAll(".chip").forEach(c=>c.classList.remove("on"));d.classList.add("on");};
  sessEl.appendChild(d); });
const lg=document.getElementById("legend");
lg.innerHTML=Object.keys(TC).map(k=>`<span class="dot" style="background:${TC[k]}"></span>${TN[k]} `).join("")+"<br>"+
  Object.keys(EC).map(k=>`<span style="color:${EC[k]}">—</span>${EN[k]} `).join("");
updateStats();
</script>
